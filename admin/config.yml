# Настройки бэкэнда. При интеграции с Netlify используется git-gateway
backend:
  name: git-gateway
  branch: main # Укажите вашу дефолтную ветку (main или master)

# Настройки загрузки медиафайлов (картинок для постов)
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# Описание структуры контента
collections:
  - name: "blog"
    label: "Посты Блога"
    folder: "_posts" # Папка, куда Jekyll складывает статьи
    create: true # Разрешить создание новых постов
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Формат имени файла для Jekyll
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Заголовок статьи", name: "title", widget: "string" }
      - { label: "Дата публикации", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss ZZ" }
      - { label: "Автор", name: "author", widget: "string", default: "mas Hakim" }
      - { label: "Категории", name: "categories", widget: "list", default: ["dev"] }
      - { label: "Теги", name: "tags", widget: "list", hint: "Через запятую или Enter" }
      - { label: "Текст поста (Markdown)", name: "body", widget: "markdown" }
