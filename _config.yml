# Основные настройки
title: "THE B.O.R.S.H"
description: "Bali Open Re-Sources Hub | mas-hakim.github.io"
baseurl: "" 
url: "https://mas-hakim.github.io"
author: "mas Hakim"
lang: "ru"
show_downloads: false

# ТЕМА
theme: jekyll-theme-hacker

# Навигация
header_pages:
  - index.md
  - notes.md
  - about.md
  - places.md
  - contacts.md

# Плагины
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Настройки парсера
markdown: kramdown
kramdown:
  input: GFM

# Исключить из обработки
exclude:
  - README.md
  - .gitignore
  - node_modules/
  - Gemfile
  - Gemfile.lock

# Формат ссылок на посты
permalink: /blog/:title/