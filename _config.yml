# Основные настройки
title: "THE B.O.R.S.H"
description: "Bali Open Re-Sources Hub | mas-hakim.github.io"
baseurl: "" 
url: "https://mas-hakim.github.io"
author: "mas Hakim"
lang: "ru"
show_downloads: false

# ТЕМА (Hacker — это максимально близкий к UNIX/Terminal стиль)
theme: jekyll-theme-hacker

# Навигация (ссылки в шапке)
header_pages:
  - index.md
  - notes.md
  - about.md
  - places.md
  - contacts.md

# Collections для постов Jekyll (стандартная папка _posts)
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Плагины
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-remote-theme

# Настройки парсера
markdown: kramdown
kramdown:
  input: GFM

# Исключить из обработки
exclude:
  - README.md
  - .gitignore
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - blog/