# Основные настройки
title: "THE B.O.R.S.H"
description: "Bali Open Re-Sources Hub"
url: "https://mas-hakim.github.io"
author: "Mas Hakim"
lang: "ru"

# ТЕМА - заменяем hacker на midnight
theme: minima

minima:
  skin: dark

# Навигация (midnight поддерживает header_pages)
nav_pages:
  - index.md
  - about.md
  - notes.md
  - contacts.md

# Плагины
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - pages/
  - blog/

permalink: /blog/:title/
