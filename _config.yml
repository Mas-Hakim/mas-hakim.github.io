# Основные настройки
title: "THE B.O.R.S.H"
description: "Bali Open Re-Sources Hub"
url: "https://mas-hakim.github.io"
author: "Mas Hakim"
lang: "ru"

# Тёмная тема (совместимая)
theme: jekyll-theme-midnight

# Навигация (автоматически создаст меню)
header_pages:
  - index.md      # Home
  - about.md      # About
  - notes.md      # Notes
  - contacts.md   # Contact

# Плагины
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Настройки
markdown: kramdown
kramdown:
  input: GFM

# Исключить из обработки
exclude:
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - pages/
  - blog/

# Формат ссылок на посты
permalink: /blog/:title/

# Количество постов на главной
paginate: 3
paginate_path: "/blog/page:num/"