# Основные настройки
title: "THE B.O.R.S.H"
description: "Bali Open Re-Sources Hub | mas-hakim.github.io"
baseurl: "" 
url: "https://mas-hakim.github.io"
author: "mas Hakim"
lang: "ru"
show_downloads: false

# ТЕМА (Hacker — это максимально близкий к UNIX/Terminal стиль)
theme: jekyll-theme-hacker

# Навигация (в этой теме ссылки появятся в шапке автоматически)
header_pages:
  - index.md
  - blog/index.md
  - strategy-person-SEO
  - about.md
  - places.md
  - contacts.md

# Collections для постов (важно для правильной обработки блога)
collections:
  posts:
    output: true
    permalink: /blog/:slug/

# Плагины (только те, что разрешены GitHub в safe-mode)
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-remote-theme

# Настройки парсера
markdown: kramdown
kramdown:
  input: GFM # GitHub Flavored Markdown

# Исключить из обработки
exclude:
  - README.md
  - .gitignore
  - node_modules/
  - Gemfile
  - Gemfile.lock

# Порядок категорий в постах
post_defaults:
  layout: post
